# The VibeGame app: a full-screen QingOS app (wasm32) for the VibeGame handheld, docs/vibegame.md.
# Its own workspace, not in the root one: it builds for wasm32 with the VibeGame SDK.
#
#   vibegame run                     # in this directory: play it in a window
#   cargo test --workspace           # the tests, on the computer
[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[package]
name = "vibegame-app"
description = "VibeBuddy on the VibeGame handheld"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vibegame-core = { path = "core" }
serde_json = "1"
# No rev, as vibegame-sdk has it, so the two are one crate; Cargo.lock pins it.
qapp = { git = "https://github.com/second-state/qingos-sdk" }
# For its font (English and GB2312).
vibegame = { git = "https://github.com/second-state/vibegame-sdk" }

[dev-dependencies]
ed25519-dalek = "2"
png = "0.17"
# The daemon's Noise library, for the computer's side in the tests.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
