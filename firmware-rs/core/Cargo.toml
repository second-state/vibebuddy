[package]
name = "vibebuddy-firmware-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Everything in the firmware that does not touch hardware: state machine, drawing, protocol handling,
# storage formats, chip register sequences. no_std, compiled once for the device and once for the Mac;
# `cargo test` on the Mac runs the whole chain.
[features]
# For on-device acceptance testing: squeezes leisure's five minutes into five seconds and the pomodoro's
# 25 minutes into 25 seconds.
fast-clock = []

[dependencies]
# The box's pairing key (link.rs). No default features: no std, no OS randomness; the seed comes from the device.
ed25519-dalek = { version = "2", default-features = false }
libm = "0.2"
# Noise sessions on links off the cable (noise.rs, ADR-0015): no std and no getrandom; the device supplies the randomness.
clatter = { version = "2.3", default-features = false, features = ["use-25519", "use-chacha20poly1305", "use-sha"] }
rand_core = { version = "0.6", default-features = false }
# Checking a firmware image written over the air (transfer.rs, ADR-0016).
sha2 = { version = "0.10", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
vibebuddy-protocol = { path = "../../protocol", default-features = false }

[dev-dependencies]
ed25519-dalek = "2"
# The simulator's Relay client (examples/simulator.rs --relay).
serde_json = "1"
tungstenite = { version = "0.30", features = ["native-tls"] }
