[package]
name = "vibebuddy-firmware"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false

# Firmware for the box (ATK-DNESP32S3-BOX, ESP32-S3): esp-hal + embassy, no_std.
# Only hardware glue lives here; the logic is all in ../core. Build separately with the Xtensa toolchain:
#   . ~/export-esp.sh && cargo build --release
# or just run tools/build-firmware.sh, which also produces the three files for flashing.
# A separate workspace: target and toolchain both differ from the Mac-side crates above.
[workspace]

[[bin]]
name = "vibebuddy-firmware"
path = "src/main.rs"
test = false
bench = false

[features]
# For on-device acceptance: compresses leisure's five minutes to five seconds and the pomodoro's
# 25 minutes to 25 seconds.
fast-clock = ["vibebuddy-firmware-core/fast-clock"]

[dependencies]
vibebuddy-firmware-core = { path = "../core" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
# Wi-Fi (ADR-0012, src/net.rs). beta.2 was yanked; beta.1 is the one that matches esp-hal 1.2 and esp-rtos 0.4.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi", "unstable"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp", "dns", "multicast"] }
# mDNS (src/net.rs): the box advertises _vibebuddy._tcp so computers find it after its address changes.
edge-mdns = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal = "0.7"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["proto-ipv4", "udp", "multicast"] }
# The Relay (src/relay.rs): TLS 1.2/1.3 with certificate checks against certs/relay-roots.pem, and WebSocket framing.
mbedtls-rs = { version = "0.3.0", features = ["esp32s3", "embassy-time", "hook-wall-clock"] }
# The wall-clock hook means mbedtls is compiled here rather than taken prebuilt; use-gcc builds it with the
# Xtensa GCC that ~/export-esp.sh (and CI) already provides, not a separate Xtensa clang.
mbedtls-rs-sys = { version = "0.3.1", features = ["use-gcc"] }
edge-ws = { version = "0.8.0", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
embassy-futures = "0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
esp-storage = { version = "0.10.0", features = ["esp32s3"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8"
critical-section = "1.2.0"
embedded-io-async = "0.7"
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

# The radio driver needs at least opt-level 2 (esp-radio's documentation).
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
