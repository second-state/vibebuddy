[workspace]
members = ["daemon", "desktop", "firmware-rs/core", "hook", "manifest", "protocol"]
# The device firmware builds separately with the Xtensa toolchain; see firmware-rs/device.
exclude = ["firmware-rs/device"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.3.3"

# Apps older than this get a banner they can't dismiss, through the update manifest (ADR-0010).
[workspace.metadata.vibebuddy]
min_supported_app = "0.3.2"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

