[package]
name = "vibebuddy-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

# The no_std firmware depends on this crate too, so serde and serde_json don't use the workspace
# dependencies: those enable default features, which would pull std into the firmware.
[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
