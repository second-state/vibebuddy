[package]
name = "vibeplay-core"
description = "What the VibePlay app does, without QingOS: pairing, the link, and the box's screens (docs/vibeplay.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
# The box's Noise library: no_std, and the ephemeral key is passed in, so wasm32 needs no getrandom.
clatter = { version = "2.3", default-features = false, features = ["use-25519", "use-chacha20poly1305", "use-sha"] }
ed25519-dalek = { version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde_json = "1"
# The box's screens, drawn by the box's own code (docs/vibeplay.md): no_std, so it builds for wasm32 too.
vibebuddy-firmware-core = { path = "../../firmware-rs/core" }
vibebuddy-protocol = { path = "../../protocol", default-features = false }

[dev-dependencies]
# The daemon's Noise library, so the tests check this side against the other one.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
