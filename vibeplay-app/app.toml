# The VibePlay app's manifest for QingOS (docs/vibeplay.md).
[app]
name      = "vibebuddy"
title     = "VibeBuddy"
title_zh  = "VibeBuddy"
version   = "0.1.0"
command   = "bin/vibebuddy.cwasm"
screen    = "full"
# The box's 320 × 240 screens at twice the size, in RGB565 (QingOS ADR 0036).
frame     = "640x480"
cover     = "assets/cover.png"
rate_hz   = 60
memory_mb = 16
# The computer connects here; QingOS answers mDNS for the type while the app runs.
listen    = 7342
mdns      = "_vibebuddy-vibeplay._tcp"
# Keep the connection while another app is in front, and call the person when an agent needs them (QingOS ADR 0042).
background = true
