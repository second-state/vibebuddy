[package]
name = "vibebuddy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vibe Buddy's tray icon and settings window outside macOS"

[[bin]]
name = "vibebuddy-desktop"
path = "src/main.rs"

[dependencies]
# Comparing the time a hook config was written with the last event, for the Codex trust hint.
chrono.workspace = true
futures = "0.3"
# Decoding the user's drawings for a Character of their own; already in the tree through iced.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The CPU renderer is plenty for a settings window and spares the wgpu build.
iced = { version = "0.14", default-features = false, features = ["crisp", "image", "tiny-skia", "tokio", "wayland", "x11"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
# Firmware zips picked with Flash from file…; the daemon unpacks the ones it downloads with the same crate.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
# The file chooser goes through the desktop portal, as other apps' do.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
