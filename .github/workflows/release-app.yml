# Apple-silicon DMG and x86_64 Linux tarball. Only a vX.Y.Z tag notarizes and publishes a GitHub Release; commits
# to main that touch packaged content only build, test and sign, keeping both packages as 7-day artifacts for self-testing.
# Firmware ships with the app (the Device tab's Update uses the copy in the bundle), so firmware/ is a trigger path too.
name: release-app

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
    paths:
      - "app/**"
      - "daemon/**"
      - "desktop/**"
      - "hook/**"
      - "protocol/**"
      - "firmware/**"
      - "firmware-rs/**"
      - "tools/build-firmware.sh"
      - "tools/make-partition-table.py"
      - "voices/**"
      - "tools/make_voice_pack.py"
      - "tools/check-localization.py"
      - "tools/package-licenses.py"
      - "packaging/**"
      - "LICENSE"
      - "LICENSE-ASSETS"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-app.yml"
  workflow_dispatch:

# Tag releases must not be cancelled by later pushes; consecutive pushes to main keep only the latest run.
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  firmware:
    # The Rust firmware (esp-hal + embassy) builds with the Xtensa toolchain; the three images are
    # architecture-independent, so build them on Linux and hand them to the macOS job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs uses git describe --tags for the firmware build ID, so tags must be visible.
          fetch-depth: 0
      - uses: esp-rs/xtensa-toolchain@v1.7
        env:
          # espup asks the GitHub API for the latest toolchain; unauthenticated, a shared runner IP gets 403 rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0
      - name: Build
        run: tools/build-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          retention-days: 1
          # build-app.sh needs the three images, plus the build ID that matches the box footer character for character.
          path: |
            firmware-rs/device/build/bootloader.bin
            firmware-rs/device/build/partition-table.bin
            firmware-rs/device/build/vibebuddy-fw.bin
            firmware-rs/device/build/build.txt

  app:
    needs: firmware
    # macos-15 is an Apple-silicon runner, so the output is arm64; no Intel build yet.
    runs-on: macos-15
    env:
      # Developer ID signing plus notarization only runs when all five signing secrets are set; otherwise fall back to ad-hoc.
      # See tools/setup-release-signing.sh for how to configure them.
      # Secrets are snapshotted when the run is created; ones written while the run is queued aren't seen, so trigger again.
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs and Info.plist both use git describe --tags for the build number, so tags must be visible.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-rs/device/build
      - name: Determine version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${RELEASE}" == "true" ]]; then
            # The tag is the version; if Cargo.toml hasn't caught up, stop rather than ship a package whose version lies.
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2; exit 1; }
            label="${GITHUB_REF_NAME}"
          else
            label="$(git describe --tags --always)"
          fi
          echo "label=${label}" >> "${GITHUB_OUTPUT}"
      - name: Test
        run: |
          rustup update stable --no-self-update
          cargo test --workspace
          swift run --package-path app SelfTest
      - name: Import signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # The certificate goes into a temporary keychain that lives only in this job, with a random password; it dies with the runner.
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          echo "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          rm "${RUNNER_TEMP}/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" login.keychain
          identity="$(security find-identity -v -p codesigning "${keychain}" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [[ -n "${identity}" ]] || { echo "no Developer ID Application certificate in the p12" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - name: Build app bundle
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          app/scripts/build-app.sh
          app/scripts/make-dmg.sh "VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg"
          # Firmware is also distributed on its own: the three images plus build.txt, which users pick via Flash from file… on the Device tab.
          ditto -c -k --norsrc "app/build/Vibe Buddy.app/Contents/Resources/firmware" \
            "VibeBuddy-firmware-${{ steps.version.outputs.label }}.zip"
      - name: Notarize
        if: env.RELEASE == 'true' && env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg"
          codesign --force --timestamp --sign "${CODESIGN_IDENTITY}" "${dmg}"
          xcrun notarytool submit "${dmg}" --wait \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}"
          # notarytool doesn't always exit non-zero when notarization fails, but staple fails without a ticket, so it is the gate;
          # then confirm once more with Gatekeeper's own assessment, and don't publish if it fails.
          xcrun stapler staple "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose "${dmg}"
      # The publish job releases this, and it stays for a week either way for self-testing.
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg
            VibeBuddy-firmware-${{ steps.version.outputs.label }}.zip
          retention-days: 7

  linux:
    needs: firmware
    # The oldest Ubuntu runner, so the binaries ask for an old glibc; Arch and Omarchy are far newer.
    runs-on: ubuntu-22.04
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daemon's build ID uses git describe --tags, so tags must be visible.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-rs/device/build
      - name: Determine version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${RELEASE}" == "true" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2; exit 1; }
            label="${GITHUB_REF_NAME}"
          else
            label="$(git describe --tags --always)"
          fi
          echo "label=${label}" >> "${GITHUB_OUTPUT}"
      - name: Install build dependencies
        # The serial port library reads USB IDs through libudev.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test
        run: |
          rustup update stable --no-self-update
          cargo test --workspace
          python3 tools/check-localization.py
      - name: Build package
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          packaging/linux/make-tarball.sh "${{ steps.version.outputs.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: VibeBuddy-${{ steps.version.outputs.label }}-linux-x86_64.tar.gz
          retention-days: 7

  publish:
    # One release for both platforms, made only once both packages exist.
    needs: [app, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${GITHUB_REF_NAME}"
          cat > notes.md <<NOTES
          **macOS:** Apple silicon Macs only (macOS 14 or later). Open the DMG and drag Vibe Buddy into Applications.

          **Linux:** x86_64 with systemd, tested on Omarchy (Arch, Hyprland). Unpack and run the installer; it sets up the daemon, the tray app and the agent hooks for your user:

          \`\`\`bash
          tar xf VibeBuddy-${label}-linux-x86_64.tar.gz
          cd VibeBuddy-${label}-linux-x86_64 && ./install.sh
          \`\`\`

          The daemon needs your user in the group that owns \`/dev/ttyACM*\` (\`uucp\` on Arch, \`dialout\` on Debian and Ubuntu); the installer tells you if it isn't.

          **Firmware:** \`VibeBuddy-firmware-${label}.zip\` is the firmware both apps ship, for flashing a box by hand.
          NOTES
          if [[ "${SIGNED}" != "true" ]]; then
            cat >> notes.md <<'NOTES'

          The macOS build isn't signed with an Apple Developer ID or notarized, so Gatekeeper blocks the first launch. Allow it either way:

          - System Settings → Privacy & Security → find the Vibe Buddy notice and click Open Anyway;
          - or run `xattr -dr com.apple.quarantine "/Applications/Vibe Buddy.app"` in Terminal.
          NOTES
          fi
          gh release create "${label}" --repo "${GITHUB_REPOSITORY}" \
            "VibeBuddy-${label}-arm64.dmg" \
            "VibeBuddy-${label}-linux-x86_64.tar.gz" \
            "VibeBuddy-firmware-${label}.zip" \
            --title "Vibe Buddy ${label}" \
            --notes-file notes.md --generate-notes
