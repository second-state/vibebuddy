# Checks every pull request, and main after it merges: the tests that were otherwise only run by hand.
# It builds nothing for release and publishes nothing: no secrets, no signing, no uploads. The device firmware
# (Xtensa toolchain) is left to release-firmware.yml; its logic is in firmware-rs/core, tested here on the host.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # The daemon, the Linux app, the hook, the manifest tool, the protocol and the firmware's host-tested core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # The serial port library reads USB IDs through libudev.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        # Errors fail the check; existing warnings are reported, not fatal.
        run: cargo clippy --workspace --all-targets --locked
      - name: Localization
        # The Mac and Linux apps share the zh-Hans table; every UI string needs its translation.
        run: python3 tools/check-localization.py
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Linux host with a simulated box
        run: bash tools/test-linux-host.sh
      - name: Simulated-device diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-host-tests
          path: target/host-tests
          if-no-files-found: ignore
          retention-days: 7

  mac-app:
    # The Mac app's model and status decoding, through its SelfTest; the app itself is built only for releases.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Built and run in two steps: since the package depends on Sparkle (a binary framework), the runner's
      # `swift run` gets SelfTest killed with SIGKILL as it starts, while the same binary run directly passes.
      - name: SelfTest
        run: |
          swift build --package-path app --product SelfTest
          "$(swift build --package-path app --show-bin-path)/SelfTest"
