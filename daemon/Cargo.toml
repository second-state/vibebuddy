[package]
name = "vibebuddyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
vibebuddy-protocol = { path = "../protocol" }
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-serial.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
crc32fast = "1"
libc = "0.2"
png = "0.17"
serialport = "4"
md-5 = "0.10"
tracing.workspace = true
tracing-subscriber.workspace = true
semver = "1"
sha2 = "0.10"
# HTTPS for the update manifest: ring rather than aws-lc (whose OpenSSL license the packaging allowlist doesn't take),
# and the system's certificate store, so a proxy whose CA the user trusts still works.
ureq = { version = "3", default-features = false, features = ["_ring", "rustls-no-provider", "platform-verifier"] }
vibebuddy-manifest = { path = "../manifest" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
